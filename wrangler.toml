name = "rngdle-ep-calculator"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Custom domain (zone cubityfir.st must be on this Cloudflare account).
# Wrangler provisions the hostname + cert on `wrangler deploy`.
[[routes]]
pattern = "rng.cubityfir.st"
custom_domain = true

# Palette gallery for /beta/boxes (src/gallery.js). `wrangler dev` provisions a local
# D1 from this binding on its own - seed it once with
#   npx wrangler d1 execute rngdle --file=schema.sql --local
#
# database_id below is a placeholder that is fine for local dev but NOT for deploy.
# Before the gallery works in production, create the real database and paste its id:
#   npx wrangler d1 create rngdle
#   npx wrangler d1 execute rngdle --file=schema.sql --remote
#   npx wrangler secret put IP_SALT       # salts the hashed submitter key
#   npx wrangler secret put ADMIN_TOKEN   # enables DELETE /api/palettes/<id>
#
# Without a real id the deployed worker still serves every other route; the gallery
# just answers 503 "not configured".
[[d1_databases]]
binding = "DB"
database_name = "rngdle"
database_id = "local-placeholder-replace-with-wrangler-d1-create"
